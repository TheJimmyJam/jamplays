    // ============================================================
    // STATE
    // ============================================================
    const audio = document.getElementById('audio');
    const tracklistEl = document.getElementById('tracklist');
    const miniplayer = document.getElementById('miniplayer');
    const mpTitle = document.getElementById('mpTitle');
    const mpPlay = document.getElementById('mpPlay');
    const mpPrev = document.getElementById('mpPrev');
    const mpNext = document.getElementById('mpNext');
    const mpCurrent = document.getElementById('mpCurrent');
    const mpDuration = document.getElementById('mpDuration');
    const mpProgress = document.getElementById('mpProgress');
    const mpProgressFill = document.getElementById('mpProgressFill');
    const playAllBtn = document.getElementById('playAllBtn');
    const coverImg = document.getElementById('coverImg');
    const mpArt = document.querySelector('.mp-art');
    const DEFAULT_COVER = coverImg.dataset.default;
    const nowPlaying = document.getElementById('nowPlaying');
    const npTitle = document.getElementById('npTitle');
    const npBody = document.getElementById('npBody');

    let currentIndex = -1;
    let trackDurations = new Array(TRACKS.length).fill(null);

    function fmtTime(s) {
      if (!isFinite(s) || s == null) return '0:00';
      const m = Math.floor(s / 60);
      const ss = Math.floor(s % 60).toString().padStart(2, '0');
      return m + ':' + ss;
    }

    // ============================================================
    // RENDER TRACKLIST
    // ============================================================
    function renderTracklist() {
      TRACKS.forEach((t, i) => {
        const row = document.createElement('div');
        row.className = 'track';
        row.dataset.index = i;
        row.innerHTML = `
          <span class="track-num">${t.n}.</span>
          <span class="track-title">${t.title}</span>
          <span class="track-duration" data-dur="${i}">—:—</span>
          <a class="track-download" href="${t.file}" download title="Download MP3" onclick="event.stopPropagation()">↓</a>
        `;
        row.addEventListener('click', () => playIndex(i, true));
        tracklistEl.appendChild(row);
      });
    }

    // ============================================================
    // PRE-LOAD DURATIONS for the tracklist
    // ============================================================
    function preloadDurations() {
      TRACKS.forEach((t, i) => {
        const probe = new Audio();
        probe.preload = 'metadata';
        probe.src = t.file;
        probe.addEventListener('loadedmetadata', () => {
          trackDurations[i] = probe.duration;
          const el = document.querySelector(`[data-dur="${i}"]`);
          if (el) el.textContent = fmtTime(probe.duration);
        });
      });
    }

    // ============================================================
    // PLAYBACK
    // ============================================================
    function swapCoverTo(src) {
      if (coverImg.src.endsWith(src)) return;
      // Preload then crossfade
      const preload = new Image();
      preload.onload = () => {
        coverImg.classList.add('swapping');
        setTimeout(() => {
          coverImg.src = src;
          coverImg.classList.remove('swapping');
        }, 180);
      };
      preload.src = src;
    }

    function playIndex(i, autoplay) {
      if (i < 0 || i >= TRACKS.length) return;
      const wasPlayingSame = (i === currentIndex && !audio.paused);
      if (wasPlayingSame) {
        audio.pause();
        return;
      }
      if (i === currentIndex) {
        audio.play();
        return;
      }
      currentIndex = i;
      audio.src = TRACKS[i].file;
      mpTitle.textContent = TRACKS[i].title;
      miniplayer.classList.add('visible');
      // Swap main cover + mini-player art to this song's art
      swapCoverTo(TRACKS[i].art);
      mpArt.style.backgroundImage = `url('${TRACKS[i].art}')`;
      // Show this song's lyrics inline
      showNowPlayingLyrics(i);
      updateRowHighlight();
      if (autoplay !== false) audio.play().catch(() => {});
    }

    function showNowPlayingLyrics(i) {
      const t = TRACKS[i];
      const lyric = LYRICS[t.title];
      npTitle.innerHTML = `<span class="num">${t.n}.</span>${t.title}`;
      if (lyric) {
        npBody.classList.remove('empty');
        npBody.textContent = lyric;
      } else {
        npBody.classList.add('empty');
        npBody.textContent = '(lyrics coming soon)';
      }
      nowPlaying.classList.add('visible');
    }

    function updateRowHighlight() {
      document.querySelectorAll('.track').forEach((row, i) => {
        row.classList.toggle('playing', i === currentIndex && !audio.paused);
      });
    }

    audio.addEventListener('play',  updateRowHighlight);
    audio.addEventListener('pause', updateRowHighlight);
    audio.addEventListener('play',  () => { mpPlay.textContent = '⏸'; });
    audio.addEventListener('pause', () => { mpPlay.textContent = '▶'; });
    audio.addEventListener('ended', () => {
      if (currentIndex < TRACKS.length - 1) playIndex(currentIndex + 1, true);
      else { mpPlay.textContent = '▶'; updateRowHighlight(); }
    });
    audio.addEventListener('loadedmetadata', () => {
      mpDuration.textContent = fmtTime(audio.duration);
    });
    audio.addEventListener('timeupdate', () => {
      mpCurrent.textContent = fmtTime(audio.currentTime);
      if (audio.duration) {
        mpProgressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    });

    mpPlay.addEventListener('click', () => {
      if (currentIndex === -1) playIndex(0, true);
      else if (audio.paused) audio.play();
      else audio.pause();
    });
    mpPrev.addEventListener('click', () => {
      // If more than ~2 seconds into the current song, restart it.
      // Otherwise (already at/near the beginning), jump to the previous track.
      if (audio.currentTime > 2) {
        audio.currentTime = 0;
      } else if (currentIndex > 0) {
        playIndex(currentIndex - 1, true);
      } else {
        audio.currentTime = 0;
      }
    });
    mpNext.addEventListener('click', () => {
      if (currentIndex < TRACKS.length - 1) playIndex(currentIndex + 1, true);
    });
    mpProgress.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = mpProgress.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });
    playAllBtn.addEventListener('click', () => playIndex(0, true));

    // ============================================================
    // INIT
    // ============================================================
    renderTracklist();
    preloadDurations();
  </script>
</body>
