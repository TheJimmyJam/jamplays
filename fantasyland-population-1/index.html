    function fmtTime(s) {

    function preloadDurations() {
      TRACKS.forEach((t, i) => {
        const probe = new Audio();
        probe.preload = 'metadata';
        probe.src = t.file;
        probe.addEventListener('loadedmetadata', () => {

    let currentAnchors    = null;
    let lyricLineEls      = [];
    let lastActiveLineIdx = -1;

    let lyricScrollEndY   = 0;
    let lyricRangeReady   = false;
    let userScrollPauseUntil = 0;

    function showNowPlayingLyrics(i) {

      const lyric = LYRICS[t.title];

      npTitle.innerHTML = `<span class="num">${t.n}.</span>${t.title}`;
      npBody.classList.remove('empty', 'anchored');
      npBody.innerHTML = '';
      currentAnchors    = anchors;
      lyricLineEls      = [];
      lastActiveLineIdx = -1;
      lyricRangeReady   = false;
      userScrollPauseUntil = 0;

      if (!lyric) {
        npBody.classList.add('empty');
        npBody.textContent = '(lyrics coming soon)';
        nowPlaying.classList.add('visible');

        npBody.classList.add('anchored');

          el.className = 'lyric-line' + (trimmed ? '' : ' blank');
          el.textContent = trimmed || ' ';
          npBody.appendChild(el);
          lyricLineEls.push(el);

        npBody.textContent = lyric;

      nowPlaying.classList.add('visible');

    // Continuous-drift scroll range (only used for songs without anchors).
    function measureLyricScrollRange() {
      lyricRangeReady = false;
      if (!nowPlaying.classList.contains('visible') || npBody.classList.contains('empty')) return;
      if (currentAnchors) return; // anchored mode handles its own scroll
      const rect = npBody.getBoundingClientRect();
      const blockTop    = window.scrollY + rect.top;
      const blockBottom = window.scrollY + rect.bottom;
      const vh = window.innerHeight;
      lyricScrollStartY = Math.max(0, blockTop - vh * 0.25);
      lyricScrollEndY   = Math.max(lyricScrollStartY, blockBottom - vh * 0.75);
      if (lyricScrollEndY - lyricScrollStartY < 40) return;
      lyricRangeReady = true;
    }

    function activeAnchorLineIdx(t, duration) {
      const A = currentAnchors;
      if (!A || !A.length) return -1;
      if (t < A[0][0]) return -1;
      let i = 0;
      for (; i < A.length - 1; i++) {
        if (t < A[i + 1][0]) break;
      }
      const [segT, segStart, segEnd] = A[i];
      const segEndT = A[i + 1] ? A[i + 1][0] : (duration || segT + 30);
      const span = segEnd - segStart;
      if (span <= 0) return segStart;
      const segProgress = Math.max(0, Math.min(1, (t - segT) / (segEndT - segT)));
      return segStart + Math.min(span - 1, Math.floor(segProgress * span));
    }

    function lyricTick() {
      requestAnimationFrame(lyricTick);
      if (audio.paused || !audio.duration || !isFinite(audio.duration)) return;

      if (currentAnchors) {
        const idx = activeAnchorLineIdx(audio.currentTime, audio.duration);
        if (idx !== lastActiveLineIdx) {
          lastActiveLineIdx = idx;
          lyricLineEls.forEach(el => el.classList.remove('active', 'near'));
          const el = idx >= 0 ? lyricLineEls[idx] : null;
          if (el) {
            el.classList.add('active');
            if (lyricLineEls[idx - 1]) lyricLineEls[idx - 1].classList.add('near');
            if (lyricLineEls[idx + 1]) lyricLineEls[idx + 1].classList.add('near');
            if (Date.now() > userScrollPauseUntil) {
              el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }
        }
      } else {
        if (!lyricRangeReady) return;
        if (Date.now() < userScrollPauseUntil) return;
        const progress = Math.max(0, Math.min(1, audio.currentTime / audio.duration));
        const target   = lyricScrollStartY + progress * (lyricScrollEndY - lyricScrollStartY);
        const current  = window.scrollY;
        const delta    = target - current;
        if (Math.abs(delta) > 0.4) {
          window.scrollTo(0, current + delta * 0.06);
        }
      }

      // Otherwise (already at/near the beginning), jump to the previous track.
      if (audio.currentTime > 2) {
        audio.currentTime = 0;
      } else if (currentIndex > 0) {
        playIndex(currentIndex - 1, true);
      } else {
        audio.currentTime = 0;
      }
    });
    mpNext.addEventListener('click', () => {
      if (currentIndex < TRACKS.length - 1) playIndex(currentIndex + 1, true);
    });
    mpProgress.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = mpProgress.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });
    playAllBtn.addEventListener('click', () => playIndex(0, true));

    // ============================================================
    // INIT
    // ============================================================
    renderTracklist();
    preloadDurations();
  </script>
</body>
</html>
