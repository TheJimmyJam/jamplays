<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JamPlays — albums by jamsounds</title>
  <meta name="description" content="JamPlays — listen to and download albums by jamsounds." />
  <link rel="canonical" href="https://jamplays.netlify.app/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="JamPlays" />
  <meta property="og:title" content="JamPlays — albums by jamsounds" />
  <meta property="og:description" content="Listen to and download albums by jamsounds." />
  <meta property="og:url" content="https://jamplays.netlify.app/" />
  <meta property="og:image" content="https://jamplays.netlify.app/fantasyland-population-1/cover.png" />
  <meta property="og:image:width" content="1400" />
  <meta property="og:image:height" content="1400" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://jamplays.netlify.app/fantasyland-population-1/cover.png" />

  <link rel="icon" type="image/png" href="fantasyland-population-1/cover.png" />

  <style>
    :root {
      --paper: #f0e6d2;
      --paper-deep: #e6daba;
      --ink: #2a1f12;
      --ink-soft: #4a3a23;
      --gold: #8b6f3f;
      --gold-deep: #6b4f2a;
      --rule: rgba(107, 79, 42, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', Garamond, serif;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 18% 22%, rgba(0,0,0,0.045) 0%, transparent 45%),
        radial-gradient(circle at 82% 78%, rgba(0,0,0,0.05) 0%, transparent 50%),
        radial-gradient(circle at 70% 15%, rgba(255,255,255,0.06) 0%, transparent 35%);
      z-index: 0;
    }
    .page {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 28px 80px;
    }
    .masthead {
      text-align: center;
      margin-bottom: 56px;
    }
    .masthead h1 {
      font-size: clamp(44px, 7vw, 64px);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .masthead .tagline {
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--gold-deep);
      margin-top: 8px;
    }
    .rule {
      width: 60px;
      height: 1px;
      background: var(--gold-deep);
      margin: 16px auto 0;
    }
    .albums-header {
      font-size: 11px;
      letter-spacing: 3px;
      text-align: center;
      color: var(--gold-deep);
      margin-bottom: 24px;
    }
    .album-card {
      display: flex;
      gap: 28px;
      align-items: center;
      padding: 28px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px dotted var(--rule);
      text-decoration: none;
      color: inherit;
      transition: background 0.2s, transform 0.2s;
      max-width: 560px;
      margin: 0 auto 24px;
    }
    .album-card:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }
    .album-card img {
      width: 160px;
      height: 160px;
      flex-shrink: 0;
      border: 6px solid var(--paper);
      box-shadow: 0 0 0 1px var(--gold-deep), 0 6px 18px rgba(42, 31, 18, 0.18);
      object-fit: cover;
      background: var(--paper-deep);
    }
    .album-meta { flex: 1; min-width: 0; }
    .album-meta .by {
      font-size: 11px;
      letter-spacing: 2.5px;
      color: var(--gold-deep);
      margin-bottom: 6px;
    }
    .album-meta h2 {
      font-size: 24px;
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.3px;
      line-height: 1.15;
      margin-bottom: 10px;
    }
    .album-meta .details {
      font-size: 13px;
      color: var(--ink-soft);
      font-style: italic;
    }
    .album-meta .cta {
      display: inline-block;
      margin-top: 14px;
      font-size: 13px;
      font-style: italic;
      color: var(--gold-deep);
      border-bottom: 1px dotted var(--gold-deep);
      padding-bottom: 2px;
    }
    .album-card:hover .cta {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }
    .footer {
      text-align: center;
      margin-top: 64px;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--gold-deep);
    }
    .footer a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .footer a:hover { border-bottom-color: var(--gold-deep); }
    .footer-rule {
      width: 40px;
      height: 1px;
      background: var(--gold-deep);
      margin: 0 auto 18px;
    }

    @media (max-width: 600px) {
      .page { padding: 48px 18px 60px; }
      .album-card {
        flex-direction: column;
        text-align: center;
        gap: 18px;
        padding: 22px;
      }
      .album-card img { width: 200px; height: 200px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1>JamPlays</h1>
      <div class="rule"></div>
      <p class="tagline">A JAMSOUNDS LISTENING ROOM</p>
    </header>

    <p class="albums-header">ALBUMS</p>

    <a class="album-card" href="fantasyland-population-1/">
      <img src="fantasyland-population-1/cover.png" alt="Fantasyland, Population 1 — album cover" />
      <div class="album-meta">
        <p class="by">JAMSOUNDS</p>
        <h2>Fantasyland,<br/>Population 1</h2>
        <p class="details">8 songs &middot; 2026</p>
        <span class="cta">Listen &amp; download &nbsp;→</span>
      </div>
    </a>

    <div class="footer">
      <div class="footer-rule"></div>
      JAMPLAYS &middot; <a href="https://jamsounds.netlify.app" target="_blank" rel="noopener">JAMSOUNDS</a>
    </div>
  </div>
</body>
</html>
